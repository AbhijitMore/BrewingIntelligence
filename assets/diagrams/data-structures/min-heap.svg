<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Min-heap tree and array representation">
  <defs>
    <style>
      .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .node-min { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .label { font: 700 15px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .caption { font: 500 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .cell { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .idx { font: 600 11px ui-monospace, Menlo, monospace; fill: #64748b; text-anchor: middle; }
      .note { font: 500 12px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <text x="260" y="24" class="caption">Min-heap: parent &lt;= children; minimum at root (index 0)</text>

  <path d="M260 52 L170 92" class="edge"/>
