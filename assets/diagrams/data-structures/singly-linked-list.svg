<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" aria-label="Singly linked list with head pointer and next links">
  <defs>
    <style>
      .canvas { fill: #fafafa; stroke: #e2e8f0; stroke-width: 1; }
      .data { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .next { fill: #eef2ff; stroke: #64748b; stroke-width: 2; }
      .divider { stroke: #94a3b8; stroke-width: 1.5; }
      .null-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 5 4; }
      .val { font: 700 15px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .hdr { font: 600 11px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .caption { font: 600 14px system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .footer { font: 500 12px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .head-lbl { font: 700 12px ui-monospace, Menlo, monospace; fill: #4f46e5; }
      .arrow { stroke: #64748b; stroke-width: 2.25; fill: none; marker-end: url(#arr); }
      .head-arrow { stroke: #4f46e5; stroke-width: 2.5; fill: none; marker-end: url(#ha); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="ha" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="16" y="12" width="648" height="226" rx="14" class="canvas"/>
  <text x="340" y="38" class="caption">Singly linked list - nodes linked by next pointers</text>

  <!-- chain centered in canvas -->
  <text x="108" y="112" class="head-lbl">head</text>
  <path d="M138 112 L168 112" class="head-arrow"/>

  <!-- node 10 -->
  <rect x="168" y="88" width="46" height="48" rx="8" class="data"/>
  <rect x="214" y="88" width="30" height="48" rx="0 8 8 0" class="next"/>
  <line x1="214" y1="88" x2="214" y2="136" class="divider"/>
  <text x="191" y="114" class="val">10</text>
  <text x="191" y="78" class="hdr">data</text>
  <text x="229" y="78" class="hdr">next</text>
  <path d="M244 112 L272 112" class="arrow"/>

  <!-- node 20 -->
  <rect x="272" y="88" width="46" height="48" rx="8" class="data"/>
  <rect x="318" y="88" width="30" height="48" rx="0 8 8 0" class="next"/>
  <line x1="318" y1="88" x2="318" y2="136" class="divider"/>
  <text x="295" y="114" class="val">20</text>
  <path d="M348 112 L376 112" class="arrow"/>

  <!-- node 30 -->
  <rect x="376" y="88" width="46" height="48" rx="8" class="data"/>
  <rect x="422" y="88" width="30" height="48" rx="0 8 8 0" class="next"/>
  <line x1="422" y1="88" x2="422" y2="136" class="divider"/>
  <text x="399" y="114" class="val">30</text>
  <path d="M452 112 L480 112" class="arrow"/>

  <rect x="480" y="98" width="56" height="28" rx="7" class="null-box"/>
  <text x="508" y="112" class="hdr">null</text>

  <text x="340" y="168" class="footer">O(1) prepend at head - O(n) access by index (walk the chain)</text>
  <text x="340" y="190" class="footer">Common patterns: reverse, merge two lists, Floyd cycle detection</text>
</svg>
