<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" role="img" aria-label="BFS level-order traversal from vertex 0">
  <defs>
    <style>
      .lvl0 { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; }
      .lvl1 { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .lvl2 { fill: #fff7ed; stroke: #d97706; stroke-width: 2.5; }
      .label { font: 700 14px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .caption { font: 500 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .legend { font: 500 12px system-ui, sans-serif; fill: #475569; }
      .edge { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .queue { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .mono { font: 600 11px ui-monospace, Menlo, monospace; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <text x="240" y="24" class="caption">BFS from vertex 0 - explore layer by layer</text>

  <circle cx="240" cy="72" r="20" class="lvl0"/>
  <text x="240" y="72" class="label">0</text>

  <circle cx="160" cy="140" r="20" class="lvl1"/>
  <text x="160" y="140" class="label">1</text>
  <circle cx="320" cy="140" r="20" class="lvl1"/>
  <text x="320" y="140" class="label">2</text>

  <circle cx="240" cy="208" r="20" class="lvl2"/>
  <text x="240" y="208" class="label">3</text>

  <path d="M228 88 L168 122" class="edge"/>
  <path d="M252 88 L312 122" class="edge"/>
  <path d="M168 158 L228 192" class="edge"/>
  <path d="M312 158 L252 192" class="edge"/>

  <text x="240" y="242" class="caption">Visit order: 0, 1, 2, 3</text>

  <rect x="60" y="258" width="360" height="30" rx="8" class="queue"/>
  <text x="240" y="273" class="mono">deque: pop 0, push 1,2, pop 1, push 3 ...</text>

  <circle cx="148" cy="318" r="8" class="lvl0"/>
  <text x="168" y="318" class="legend" dominant-baseline="middle">level 0</text>
  <circle cx="242" cy="318" r="8" class="lvl1"/>
  <text x="262" y="318" class="legend" dominant-baseline="middle">level 1</text>
  <circle cx="336" cy="318" r="8" class="lvl2"/>
  <text x="356" y="318" class="legend" dominant-baseline="middle">level 2</text>
</svg>
