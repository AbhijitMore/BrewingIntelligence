<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-label="Trie storing app, apple, bat, ball, and batman">
  <defs>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="endGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font: 700 15px ui-monospace, Menlo, monospace; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .root-label { font: 700 15px ui-monospace, Menlo, monospace; fill: #3730a3; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #94a3b8; stroke-width: 2.25; fill: none; stroke-linecap: round; }
      .caption { font: 600 14px system-ui, -apple-system, sans-serif; fill: #334155; text-anchor: middle; }
      .subcaption { font: 500 12px system-ui, -apple-system, sans-serif; fill: #64748b; text-anchor: middle; }
      .legend { font: 500 12px system-ui, -apple-system, sans-serif; fill: #475569; }
      .word { font: 600 11px ui-monospace, Menlo, monospace; fill: #047857; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="12" y="12" width="756" height="456" rx="16" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>

  <text x="390" y="32" class="caption">Prefix tree</text>
  <text x="390" y="50" class="subcaption">app · apple · bat · ball · batman</text>

  <!-- edges (parent bottom → child top) -->
  <path d="M390 106 C390 114 260 114 260 122" class="edge"/>
  <path d="M390 106 C390 114 520 114 520 122" class="edge"/>
  <path d="M260 166 L260 188" class="edge"/>
  <path d="M260 228 L260 250" class="edge"/>
  <path d="M260 290 L260 312" class="edge"/>
  <path d="M260 352 L260 374" class="edge"/>
  <path d="M520 166 L520 188" class="edge"/>
  <path d="M520 228 C520 238 420 238 420 250" class="edge"/>
  <path d="M520 228 C520 238 620 238 620 250" class="edge"/>
  <path d="M420 290 L420 312" class="edge"/>
  <path d="M420 352 L420 374" class="edge"/>
  <path d="M420 414 L420 416" class="edge"/>
  <path d="M620 290 L620 312" class="edge"/>

  <!-- root -->
  <circle cx="390" cy="84" r="22" fill="url(#rootGrad)" stroke="#6366f1" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="390" y="84" class="root-label">R</text>

  <!-- app / apple branch -->
  <circle cx="260" cy="146" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="146" class="label">a</text>

  <circle cx="260" cy="208" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="208" class="label">p</text>

  <circle cx="260" cy="270" r="20" fill="url(#endGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="260" y="270" class="label">p</text>
  <rect x="292" y="258" width="38" height="24" rx="12" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1"/>
  <text x="311" y="270" class="word">app</text>

  <circle cx="260" cy="332" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="332" class="label">l</text>

  <circle cx="260" cy="394" r="20" fill="url(#endGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="260" y="394" class="label">e</text>
  <rect x="292" y="382" width="48" height="24" rx="12" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1"/>
  <text x="316" y="394" class="word">apple</text>

  <!-- bat / ball / batman branch -->
  <circle cx="520" cy="146" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="146" class="label">b</text>

  <circle cx="520" cy="208" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="208" class="label">a</text>

  <!-- bat + batman -->
  <circle cx="420" cy="270" r="20" fill="url(#endGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="420" y="270" class="label">t</text>
  <rect x="452" y="258" width="38" height="24" rx="12" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1"/>
  <text x="471" y="270" class="word">bat</text>

  <circle cx="420" cy="332" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="332" class="label">m</text>

  <circle cx="420" cy="394" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="394" class="label">a</text>

  <circle cx="420" cy="436" r="20" fill="url(#endGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="420" y="436" class="label">n</text>
  <rect x="452" y="424" width="58" height="24" rx="12" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1"/>
  <text x="481" y="436" class="word">batman</text>

  <!-- ball -->
  <circle cx="620" cy="270" r="20" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="270" class="label">l</text>

  <circle cx="620" cy="332" r="20" fill="url(#endGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="620" y="332" class="label">l</text>
  <rect x="652" y="320" width="42" height="24" rx="12" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1"/>
  <text x="673" y="332" class="word">ball</text>

  <!-- legend -->
  <rect x="28" y="444" width="292" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="48" cy="458" r="9" fill="url(#endGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="66" y="458" class="legend" dominant-baseline="middle">Green node = word ends here (is_end_of_word)</text>
</svg>
