<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="Queue FIFO diagram">
  <defs>
    <style>
      .frame { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .front { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .rear { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; }
      .label { font: 600 14px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .caption { font: 500 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .action { font: 600 12px system-ui, sans-serif; }
      .arrow-in { stroke: #4f46e5; stroke-width: 2.5; fill: none; marker-end: url(#ain); }
      .arrow-out { stroke: #059669; stroke-width: 2.5; fill: none; marker-end: url(#aout); }
    </style>
    <marker id="ain" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f46e5"/>
    </marker>
    <marker id="aout" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <text x="280" y="24" class="caption">Queue - First In, First Out (FIFO)</text>

  <rect x="120" y="88" width="70" height="50" rx="6" class="front"/>
  <text x="155" y="113" class="label">10</text>
  <text x="155" y="152" class="action" fill="#059669">front</text>

  <rect x="200" y="88" width="70" height="50" rx="6" class="frame"/>
  <text x="235" y="113" class="label">20</text>
  <rect x="280" y="88" width="70" height="50" rx="6" class="frame"/>
  <text x="315" y="113" class="label">30</text>

  <rect x="360" y="88" width="70" height="50" rx="6" class="rear"/>
  <text x="395" y="113" class="label">40</text>
  <text x="395" y="152" class="action" fill="#4f46e5">rear</text>

  <path d="M455 113 L432 113" class="arrow-in"/>
  <text x="462" y="108" class="action" fill="#4f46e5">enqueue</text>

  <path d="M115 113 L72 113" class="arrow-out"/>
  <text x="68" y="108" class="action" fill="#059669" text-anchor="end">dequeue</text>

  <text x="280" y="200" class="caption">dequeue returns 10; enqueue adds at rear</text>
  <text x="280" y="222" class="caption">Python: collections.deque (never list.pop(0))</text>
</svg>
