<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Binary tree with traversal order annotations">
  <defs>
    <style>
      .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .node-root { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; }
      .label { font: 700 16px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .caption { font: 500 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .legend { font: 500 12px system-ui, sans-serif; fill: #64748b; }
      .mono { font: 600 12px ui-monospace, Menlo, monospace; fill: #64748b; }
    </style>
  </defs>

  <text x="320" y="24" class="caption">Example binary tree - numbers show pre-order visit index</text>

  <path d="M320 70 L200 130" class="edge"/>
  <path d="M320 70 L440 130" class="edge"/>
  <path d="M200 130 L140 190" class="edge"/>
  <path d="M200 130 L260 190" class="edge"/>
  <path d="M440 130 L380 190" class="edge"/>
  <path d="M440 130 L500 190" class="edge"/>

  <circle cx="320" cy="58" r="26" class="node-root"/>
  <text x="320" y="58" class="label">1</text>
  <circle cx="200" cy="148" r="24" class="node"/>
  <text x="200" y="148" class="label">2</text>
  <circle cx="440" cy="148" r="24" class="node"/>
  <text x="440" y="148" class="label">3</text>
  <circle cx="140" cy="208" r="22" class="node"/>
  <text x="140" y="208" class="label">4</text>
  <circle cx="260" cy="208" r="22" class="node"/>
  <text x="260" y="208" class="label">5</text>
  <circle cx="380" cy="208" r="22" class="node"/>
  <text x="380" y="208" class="label">6</text>
  <circle cx="500" cy="208" r="22" class="node"/>
  <text x="500" y="208" class="label">7</text>

  <text x="40" y="270" class="legend">Pre-order (NLR):</text>
  <text x="160" y="270" class="mono">1, 2, 4, 5, 3, 6, 7</text>
  <text x="40" y="295" class="legend">In-order (LNR):</text>
  <text x="160" y="295" class="mono">4, 2, 5, 1, 6, 3, 7</text>
  <text x="40" y="320" class="legend">Post-order (LRN):</text>
  <text x="160" y="320" class="mono">4, 5, 2, 6, 7, 3, 1</text>
</svg>
