<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Segment tree for range sum queries">
  <defs>
    <style>
      .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .root { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; }
      .query { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .leaf { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .leaf-hi { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .label { font: 700 13px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .range { font: 500 10px ui-monospace, Menlo, monospace; fill: #64748b; text-anchor: middle; }
      .caption { font: 500 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .idx { font: 600 11px ui-monospace, Menlo, monospace; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <text x="260" y="24" class="caption">Segment tree - each node stores aggregate over an index range</text>

  <path d="M260 52 L160 100" class="edge"/>
  <path d="M260 52 L360 100" class="edge"/>
  <path d="M160 100 L110 148" class="edge"/>
  <path d="M160 100 L210 148" class="edge"/>
  <path d="M360 100 L310 148" class="edge"/>
  <path d="M360 100 L410 148" class="edge"/>

  <circle cx="260" cy="44" r="22" class="root"/>
  <text x="260" y="44" class="label">16</text>
  <text x="260" y="68" class="range">[0-3]</text>

  <circle cx="160" cy="112" r="20" class="node"/>
  <text x="160" y="112" class="label">4</text>
  <text x="160" y="132" class="range">[0-1]</text>

  <circle cx="360" cy="112" r="20" class="query"/>
  <text x="360" y="112" class="label">12</text>
  <text x="360" y="132" class="range">[2-3]</text>

  <rect x="88" y="156" width="44" height="32" rx="6" class="leaf"/>
  <text x="110" y="172" class="label">1</text>
  <text x="110" y="198" class="idx">i=0</text>

  <rect x="168" y="156" width="44" height="32" rx="6" class="leaf"/>
  <text x="190" y="172" class="label">3</text>
  <text x="190" y="198" class="idx">i=1</text>

  <rect x="288" y="156" width="44" height="32" rx="6" class="leaf-hi"/>
  <text x="310" y="172" class="label">5</text>
  <text x="310" y="198" class="idx">i=2</text>

  <rect x="368" y="156" width="44" height="32" rx="6" class="leaf-hi"/>
  <text x="390" y="172" class="label">7</text>
  <text x="390" y="198" class="idx">i=3</text>

  <text x="260" y="232" class="caption">Array [1, 3, 5, 7] - sumRange(2, 3) = 12 (green subtree, O(log n))</text>
  <text x="260" y="254" class="caption">Build O(n) - point update O(log n) - range query O(log n)</text>
</svg>
