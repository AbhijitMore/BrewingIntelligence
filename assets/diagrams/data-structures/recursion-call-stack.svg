<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Recursion call stack for factorial(4)">
  <defs>
    <style>
      .frame { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .active { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; }
      .base { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .label { font: 600 13px ui-monospace, Menlo, monospace; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .caption { font: 500 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .side { font: 600 12px system-ui, sans-serif; fill: #64748b; }
      .return { stroke: #059669; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <text x="280" y="24" class="caption">Call stack while evaluating factorial(4)</text>
  <text x="468" y="52" class="side">stack grows down</text>

  <rect x="140" y="60" width="240" height="42" rx="8" class="frame"/>
  <text x="260" y="81" class="label">factorial(4) waits for 4 * ...</text>

  <rect x="140" y="112" width="240" height="42" rx="8" class="frame"/>
  <text x="260" y="133" class="label">factorial(3) waits for 3 * ...</text>

  <rect x="140" y="164" width="240" height="42" rx="8" class="frame"/>
  <text x="260" y="185" class="label">factorial(2) waits for 2 * ...</text>

  <rect x="140" y="216" width="240" height="42" rx="8" class="active"/>
  <text x="260" y="237" class="label">factorial(1) hits base case</text>

  <rect x="140" y="268" width="240" height="42" rx="8" class="base"/>
  <text x="260" y="289" class="label">return 1</text>

  <path d="M400 81 L430 81 L430 289 L400 289" class="return"/>
  <text x="438" y="190" class="side" fill="#059669">returns unwind</text>
  <text x="438" y="206" class="side" fill="#059669">2, 6, 24</text>

  <text x="280" y="340" class="caption">Space: O(n) stack frames for factorial(n)</text>
</svg>
